name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            smoke: true
          - os: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
            smoke: true
          - os: macos-13
            triple: x86_64-apple-darwin
            smoke: false
          - os: macos-14
            triple: aarch64-apple-darwin
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.triple }} -p r2smt-cli

      - name: Strip binary
        run: strip target/${{ matrix.triple }}/release/r2smt

      - name: Smoke test
        if: matrix.smoke
        run: target/${{ matrix.triple }}/release/r2smt version

      - name: Determine version tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: bash
        run: |
          TARBALL="r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.tar.gz"
          tar czf "$TARBALL" -C target/${{ matrix.triple }}/release r2smt
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: r2smt-${{ matrix.triple }}
          path: ${{ env.tarball }}
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: r2SMT ${{ steps.tag.outputs.version }}
          files: ${{ env.tarball }}
          body: |
            # r2SMT ${{ steps.tag.outputs.version }}

            This is the first release of r2SMT and publishes a full multi-crate workspace.
            It includes the reverse-engineering analysis pipeline and tooling built around:

            - `r2smt` command line interface (`r2smt`) for running analysis, patching, and reporting.
            - Core orchestration and control flow through `r2smt-core`.
            - Binary lifting for ESIL and Ghidra P-code in `r2smt-esil` and `r2smt-pcode`.
            - Slicer and SSA conversion pipelines in `r2smt-slicer` and `r2smt-ssa`.
            - SMT backend and solver abstractions in `r2smt-smt`, `r2smt-solver-port`, and `r2smt-z3fp`.
            - Patch planning and application logic in `r2smt-patch`.
            - Report generation in `r2smt-report`.
            - Differential and cross-check tooling in `r2smt-difflift`.
            - Exploration worker in `r2smt-explore`.
            - Taint propagation with `r2smt-taint`.
            - Shared data model and utilities in `r2smt-common`, `r2smt-ir`, and `r2smt-r2pipe`.

            Binary packages are built for:
            - Linux x86_64
            - Linux ARM64
            - macOS x86_64
            - macOS ARM64

            Release artifacts are attached to this release, and crates are also published to crates.io from this tag.
          fail_on_unmatched_files: true

  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
