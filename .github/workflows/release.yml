name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CXXFLAGS: -std=c++20

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build release binary
        env:
          Z3_SYS_Z3_VERSION: 4.16.0
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: cargo build --release --target ${{ matrix.triple }} -p r2smt-cli

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.triple }}/release/r2smt

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: target/${{ matrix.triple }}/release/r2smt version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "target/${{ matrix.triple }}/release/r2smt.exe" version'

      - name: Determine version tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARBALL="r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.tar.gz"
          tar czf "$TARBALL" -C target/${{ matrix.triple }}/release r2smt
          echo "archive=$TARBALL" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.zip"
          Compress-Archive -Path "target/${{ matrix.triple }}/release/r2smt.exe" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: r2smt-${{ matrix.triple }}
          path: ${{ env.archive }}
          if-no-files-found: error

  publish-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: r2smt-*
          merge-multiple: true

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: r2SMT ${{ github.ref_name }}
          files: dist/*
          body: |
            # r2SMT ${{ github.ref_name }}

            r2SMT 0.1.1 expands the first release with broader binary distribution and Rust 1.97 compatibility.

            ## What's new

            - Added prebuilt command-line binaries for Linux, macOS, and Windows on both x86_64 and ARM64.
            - Added native release builds, smoke tests, and platform-specific archives for all six targets.
            - Upgraded the release runtime to Z3 4.16.0, including official Windows ARM64 support.
            - Updated the codebase for the Clippy lints shipped with Rust 1.97 while preserving behavior.

            ## Downloads

            - Linux x86_64 and ARM64: `.tar.gz`
            - macOS x86_64 and ARM64: `.tar.gz`
            - Windows x86_64 and ARM64: `.zip`

            All workspace crates are also published to crates.io at version 0.1.1.
          fail_on_unmatched_files: true

  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1)"
          version="$(echo "$metadata" | jq -r '.packages[] | select(.name == "r2smt-cli") | .version' | head -n 1)"

          edge_file="$(mktemp)"
          node_file="$(mktemp)"
          trap 'rm -f "$edge_file" "$node_file"' EXIT

          echo "$metadata" | jq -r '
            . as $m
            | ($m.packages | map({key: .id, value: .name}) | from_entries) as $ids
            | $m.resolve.nodes[]
            | .id as $from
            | .deps[]
            | select(.pkg | startswith("path+file://"))
            | ($ids[$from] + " " + $ids[.pkg])
          ' > "$edge_file"
          echo "$metadata" | jq -r '.packages[] | select(.source == null) | .name' | awk '{print $1 " " $1}' > "$node_file"

          for crate in $( (cat "$edge_file"; cat "$node_file") | tsort | tac ); do
            for attempt in 1 2 3 4 5; do
              if output="$(cargo publish --locked -p "${crate}" 2>&1)"; then
                echo "Published ${crate} ${version}"
                continue 2
              fi

              if echo "$output" | grep -q "already exists on crates.io index"; then
                echo "${crate} ${version} already exists on crates.io, skipping"
                continue 2
              fi

              if echo "$output" | grep -q "Too Many Requests"; then
                if [ "$attempt" -ge 5 ]; then
                  echo "$output"
                  echo "Failed publishing ${crate} after 5 rate-limit retries"
                  exit 1
                fi

                wait=$((attempt * 120))
                echo "${crate} publish rate-limited (attempt ${attempt}/5); retrying after ${wait}s"
                sleep "$wait"
                continue
              fi

              echo "$output"
              echo "Failed publishing ${crate}; aborting"
              exit 1
            done
          done
