name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CXXFLAGS: -std=c++20

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            triple: x86_64-apple-darwin
          - os: macos-15
            triple: aarch64-apple-darwin
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.triple }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build release binary
        env:
          Z3_SYS_Z3_VERSION: 4.16.0
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: cargo build --release --target ${{ matrix.triple }} -p r2smt-cli

      - name: Bundle Z3 runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $z3 = Get-ChildItem "target/${{ matrix.triple }}/release/build/z3-sys-*/out/z3-*/bin/libz3.dll" | Select-Object -First 1
          if (-not $z3) { throw "libz3.dll not found" }
          Copy-Item $z3.FullName "target/${{ matrix.triple }}/release/libz3.dll"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.triple }}/release/r2smt

      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: 6.2.0

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          target/${{ matrix.triple }}/release/r2smt doctor
          target/${{ matrix.triple }}/release/r2smt analyze /usr/bin/true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.triple }}/release/r2smt.exe" doctor
          & "target/${{ matrix.triple }}/release/r2smt.exe" analyze "$env:SystemRoot\System32\where.exe"

      - name: Determine version tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARBALL="r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.tar.gz"
          tar czf "$TARBALL" -C target/${{ matrix.triple }}/release r2smt
          echo "archive=$TARBALL" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.zip"
          Compress-Archive -Path "target/${{ matrix.triple }}/release/r2smt.exe", "target/${{ matrix.triple }}/release/libz3.dll" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_ENV

      - name: SHA-256 checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: shasum -a 256 "$archive" > "$archive.sha256"

      - name: SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:archive).Hash.ToLower()
          "$hash  $env:archive" | Set-Content "$env:archive.sha256" -Encoding ascii

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ env.archive }}
          format: spdx-json
          output-file: ${{ env.archive }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ env.archive }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: r2smt-${{ matrix.triple }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
            ${{ env.archive }}.spdx.json
          if-no-files-found: error

  publish-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: r2smt-*
          merge-multiple: true

      - name: Publish to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: r2SMT ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          Z3_SYS_Z3_VERSION: 4.16.0
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1)"
          version="$(echo "$metadata" | jq -r '.packages[] | select(.name == "r2smt-cli") | .version' | head -n 1)"

          edge_file="$(mktemp)"
          node_file="$(mktemp)"
          trap 'rm -f "$edge_file" "$node_file"' EXIT

          echo "$metadata" | jq -r '
            . as $m
            | ($m.packages | map({key: .id, value: .name}) | from_entries) as $ids
            | $m.resolve.nodes[]
            | .id as $from
            | .deps[]
            | select(.pkg | startswith("path+file://"))
            | ($ids[$from] + " " + $ids[.pkg])
          ' > "$edge_file"
          echo "$metadata" | jq -r '.packages[] | select(.source == null) | .name' | awk '{print $1 " " $1}' > "$node_file"

          for crate in $( (cat "$edge_file"; cat "$node_file") | tsort | tac ); do
            for attempt in 1 2 3 4 5; do
              if output="$(cargo publish --locked -p "${crate}" 2>&1)"; then
                echo "Published ${crate} ${version}"
                continue 2
              fi

              if echo "$output" | grep -q "already exists on crates.io index"; then
                echo "${crate} ${version} already exists on crates.io, skipping"
                continue 2
              fi

              if echo "$output" | grep -q "Too Many Requests"; then
                if [ "$attempt" -ge 5 ]; then
                  echo "$output"
                  echo "Failed publishing ${crate} after 5 rate-limit retries"
                  exit 1
                fi

                wait=$((attempt * 120))
                echo "${crate} publish rate-limited (attempt ${attempt}/5); retrying after ${wait}s"
                sleep "$wait"
                continue
              fi

              echo "$output"
              echo "Failed publishing ${crate}; aborting"
              exit 1
            done
          done
