name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CXXFLAGS: -std=c++20
  R2_RELEASE_VERSION: 6.2.4

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            r2pm_triplet: linux-x86-64
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            r2pm_triplet: linux-arm-64
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            r2pm_triplet: darwin-x86-64
          - os: macos-15
            triple: aarch64-apple-darwin
            r2pm_triplet: darwin-arm-64
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            r2pm_triplet: windows-x86-64
            msvc_arch: amd64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            r2pm_triplet: windows-arm-64
            msvc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.triple }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang zip

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build release binary
        env:
          Z3_SYS_Z3_VERSION: 4.16.0
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: cargo build --release --target ${{ matrix.triple }} -p r2smt-cli

      - name: Bundle Z3 runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $z3 = Get-ChildItem "target/${{ matrix.triple }}/release/build/z3-sys-*/out/z3-*/bin/libz3.dll" | Select-Object -First 1
          if (-not $z3) { throw "libz3.dll not found" }
          Copy-Item $z3.FullName "target/${{ matrix.triple }}/release/libz3.dll"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.triple }}/release/r2smt

      - name: Install radare2
        id: radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: ${{ env.R2_RELEASE_VERSION }}

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build radare2 plugin (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make -B plugin
          extension="$(r2 -H R2_LIBEXT)"
          abi="$(r2 -H R2_ABIVERSION)"
          plugin="target/r2-plugin/${abi}/core_r2smt.${extension}"
          test -f "$plugin"
          echo "plugin=$plugin" >> "$GITHUB_ENV"

      - name: Build radare2 plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $plugin = "target/${{ matrix.triple }}/release/core_r2smt.dll"
          ./scripts/build-r2-plugin.ps1 -Radare2Prefix "${{ steps.radare2.outputs.prefix }}" -Output $plugin
          "plugin=$plugin" >> $env:GITHUB_ENV

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: |
          target/${{ matrix.triple }}/release/r2smt doctor
          target/${{ matrix.triple }}/release/r2smt analyze /usr/bin/true
          ./scripts/r2-plugin-smoke.sh "$plugin"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "target/${{ matrix.triple }}/release/r2smt.exe" doctor
          & "target/${{ matrix.triple }}/release/r2smt.exe" analyze "$env:SystemRoot\System32\where.exe"
          $pluginDir = (& r2 -H R2_USER_PLUGINS).Trim()
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          $installedPlugin = Join-Path $pluginDir 'core_r2smt.dll'
          Copy-Item $env:plugin $installedPlugin -Force
          $env:R2SMT_CLI = (Resolve-Path "target/${{ matrix.triple }}/release/r2smt.exe").Path
          $output = & r2 -2Nq -e scr.color=false -c 'r2smt version;q' "$env:SystemRoot\System32\where.exe"
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch '(?m)^r2smt ') {
            throw "r2smt core plugin smoke test failed: $output"
          }
          Remove-Item $installedPlugin -Force

      - name: Determine version tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TARBALL="r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.tar.gz"
          tar czf "$TARBALL" -C target/${{ matrix.triple }}/release r2smt
          echo "archive=$TARBALL" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.zip"
          Compress-Archive -Path "target/${{ matrix.triple }}/release/r2smt.exe", "target/${{ matrix.triple }}/release/libz3.dll" -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_ENV

      - name: Package r2pm bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="${RUNNER_TEMP}/r2smt-r2pm"
          rm -rf "$stage"
          mkdir -p "$stage/bin" "$stage/plugins"
          cp "target/${{ matrix.triple }}/release/r2smt" "$stage/bin/r2smt"
          cp "$plugin" "$stage/plugins/"
          cp r2pm/r2smt.r2 "$stage/plugins/r2smt.r2"
          r2pm_archive="r2smt-r2pm-${{ steps.tag.outputs.version }}-r2-${R2_RELEASE_VERSION}-${{ matrix.r2pm_triplet }}.zip"
          (cd "$stage" && zip -qr "${GITHUB_WORKSPACE}/${r2pm_archive}" bin plugins)
          echo "r2pm_archive=$r2pm_archive" >> "$GITHUB_ENV"

      - name: Package r2pm bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'r2smt-r2pm'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$stage\bin", "$stage\plugins" | Out-Null
          Copy-Item "target/${{ matrix.triple }}/release/r2smt.exe", "target/${{ matrix.triple }}/release/libz3.dll" -Destination "$stage\bin"
          Copy-Item $env:plugin, "r2pm/r2smt.r2" -Destination "$stage\plugins"
          $r2pmArchive = "r2smt-r2pm-${{ steps.tag.outputs.version }}-r2-$env:R2_RELEASE_VERSION-${{ matrix.r2pm_triplet }}.zip"
          Compress-Archive -Path "$stage\bin", "$stage\plugins" -DestinationPath $r2pmArchive
          "r2pm_archive=$r2pmArchive" >> $env:GITHUB_ENV

      - name: SHA-256 checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 "$archive" > "$archive.sha256"
          shasum -a 256 "$r2pm_archive" > "$r2pm_archive.sha256"

      - name: SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($archive in @($env:archive, $env:r2pm_archive)) {
            $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
            $line = "$hash  $archive`n"
            [System.IO.File]::WriteAllText("$archive.sha256", $line, [System.Text.UTF8Encoding]::new($false))
          }

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ env.archive }}
          format: spdx-json
          output-file: ${{ env.archive }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate r2pm bundle SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: ${{ env.r2pm_archive }}
          format: spdx-json
          output-file: ${{ env.r2pm_archive }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.archive }}

      - name: Attest r2pm bundle provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.r2pm_archive }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2smt-${{ matrix.triple }}
          path: |
            ${{ env.archive }}
            ${{ env.archive }}.sha256
            ${{ env.archive }}.spdx.json
            ${{ env.r2pm_archive }}
            ${{ env.r2pm_archive }}.sha256
            ${{ env.r2pm_archive }}.spdx.json
          if-no-files-found: error

  publish-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: r2smt-*
          merge-multiple: true

      - name: Publish to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: r2SMT ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
          Z3_SYS_Z3_VERSION: 4.16.0
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1)"
          version="$(echo "$metadata" | jq -r '.packages[] | select(.name == "r2smt-cli") | .version' | head -n 1)"

          edge_file="$(mktemp)"
          node_file="$(mktemp)"
          trap 'rm -f "$edge_file" "$node_file"' EXIT

          echo "$metadata" | jq -r '
            . as $m
            | ($m.packages | map({key: .id, value: .name}) | from_entries) as $ids
            | $m.resolve.nodes[]
            | .id as $from
            | .deps[]
            | select(.pkg | startswith("path+file://"))
            | ($ids[$from] + " " + $ids[.pkg])
          ' > "$edge_file"
          echo "$metadata" | jq -r '.packages[] | select(.source == null) | .name' | awk '{print $1 " " $1}' > "$node_file"

          for crate in $( (cat "$edge_file"; cat "$node_file") | tsort | tac ); do
            for attempt in 1 2 3 4 5; do
              if output="$(cargo publish --locked -p "${crate}" 2>&1)"; then
                echo "Published ${crate} ${version}"
                continue 2
              fi

              if echo "$output" | grep -q "already exists on crates.io index"; then
                echo "${crate} ${version} already exists on crates.io, skipping"
                continue 2
              fi

              if echo "$output" | grep -q "Too Many Requests"; then
                if [ "$attempt" -ge 5 ]; then
                  echo "$output"
                  echo "Failed publishing ${crate} after 5 rate-limit retries"
                  exit 1
                fi

                wait=$((attempt * 120))
                echo "${crate} publish rate-limited (attempt ${attempt}/5); retrying after ${wait}s"
                sleep "$wait"
                continue
              fi

              echo "$output"
              echo "Failed publishing ${crate}; aborting"
              exit 1
            done
          done

  r2pm-binary-smoke:
    name: r2pm binary install ${{ matrix.r2pm_triplet }}
    runs-on: ${{ matrix.os }}
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            r2pm_triplet: linux-x86-64
            platform: linux
          - os: ubuntu-24.04-arm
            r2pm_triplet: linux-arm-64
            platform: linux
          - os: macos-15-intel
            r2pm_triplet: darwin-x86-64
            platform: darwin
          - os: macos-15
            r2pm_triplet: darwin-arm-64
            platform: darwin
          - os: windows-2025
            r2pm_triplet: windows-x86-64
            platform: windows
          - os: windows-11-arm
            r2pm_triplet: windows-arm-64
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: ${{ env.R2_RELEASE_VERSION }}

      - name: Install and uninstall binary package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/r2pm-binary-smoke
        run: |
          r2pm -U
          dbdir="$(r2pm -H R2PM_DBDIR)"
          cp r2pm/r2smt "$dbdir/r2smt"
          metadata="$(r2pm -sj r2smt)"
          jq -e --arg platform '${{ matrix.platform }}' \
            '.[0].binary == true and (.[0].platforms | index($platform))' <<<"$metadata"
          r2pm -bi r2smt
          cli="$(r2pm -H R2PM_BINDIR)/r2smt"
          plugin="$(r2pm -H R2PM_PLUGDIR)/core_r2smt.$(r2 -H R2_LIBEXT)"
          "$cli" version
          test -f "$plugin"
          test -f "$(r2pm -H R2PM_PLUGDIR)/r2smt.r2"
          ./scripts/r2-plugin-smoke.sh "$plugin"
          r2pm -u r2smt
          test ! -e "$cli"
          test ! -e "$plugin"

      - name: Install and uninstall binary package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          r2pm -U
          $dbdir = (& r2pm -H R2PM_DBDIR).Trim()
          Copy-Item r2pm/r2smt "$dbdir/r2smt" -Force
          $metadata = (& r2pm -sj r2smt | ConvertFrom-Json)[0]
          if (-not $metadata.binary -or $metadata.platforms -notcontains 'windows') {
            throw 'r2smt is not exposed as a Windows binary package'
          }
          r2pm -bi r2smt
          if ($LASTEXITCODE -ne 0) { throw 'r2pm binary install failed' }
          $bindir = (& r2pm -H R2PM_BINDIR).Trim()
          $plugdir = (& r2pm -H R2PM_PLUGDIR).Trim()
          $cli = Join-Path $bindir 'r2smt.exe'
          $plugin = Join-Path $plugdir 'core_r2smt.dll'
          & $cli version
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $plugin) -or -not (Test-Path (Join-Path $plugdir 'r2smt.r2'))) {
            throw 'r2pm binary package contents are incomplete'
          }
          $env:R2SMT_CLI = $cli
          $output = & r2 -2Nq -e scr.color=false -c 'r2smt version;q' "$env:SystemRoot\System32\where.exe"
          if ($LASTEXITCODE -ne 0 -or ($output -join "`n") -notmatch '(?m)^r2smt ') {
            throw "installed r2smt plugin smoke test failed: $output"
          }
          r2pm -u r2smt
          if ((Test-Path $cli) -or (Test-Path $plugin)) { throw 'r2pm binary uninstall left installed files' }
