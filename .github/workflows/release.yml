name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CXXFLAGS: -std=c++20

jobs:
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            smoke: true
          - os: macos-14
            triple: aarch64-apple-darwin
            smoke: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.triple }}

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build release binary
        env:
          Z3_SYS_Z3_VERSION: 4.12.5
          READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
        run: cargo build --release --target ${{ matrix.triple }} -p r2smt-cli

      - name: Strip binary
        run: strip target/${{ matrix.triple }}/release/r2smt

      - name: Smoke test
        if: matrix.smoke
        run: target/${{ matrix.triple }}/release/r2smt version

      - name: Determine version tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: bash
        run: |
          TARBALL="r2smt-${{ steps.tag.outputs.version }}-${{ matrix.triple }}.tar.gz"
          tar czf "$TARBALL" -C target/${{ matrix.triple }}/release r2smt
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: r2smt-${{ matrix.triple }}
          path: ${{ env.tarball }}
          if-no-files-found: error

  publish-release:
    name: publish github release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: r2smt-*
          merge-multiple: true

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: r2SMT ${{ github.ref_name }}
          files: dist/*.tar.gz
          body: |
            # r2SMT ${{ github.ref_name }}

            This is the first release of r2SMT and publishes a full multi-crate workspace.
            It includes the reverse-engineering analysis pipeline and tooling built around:

            - `r2smt` command line interface (`r2smt`) for running analysis, patching, and reporting.
            - Core orchestration and control flow through `r2smt-core`.
            - Binary lifting for ESIL and Ghidra P-code in `r2smt-esil` and `r2smt-pcode`.
            - Slicer and SSA conversion pipelines in `r2smt-slicer` and `r2smt-ssa`.
            - SMT backend and solver abstractions in `r2smt-smt`, `r2smt-solver-port`, and `r2smt-z3fp`.
            - Patch planning and application logic in `r2smt-patch`.
            - Report generation in `r2smt-report`.
            - Differential and cross-check tooling in `r2smt-difflift`.
            - Exploration worker in `r2smt-explore`.
            - Taint propagation with `r2smt-taint`.
            - Shared data model and utilities in `r2smt-common`, `r2smt-ir`, and `r2smt-r2pipe`.

            Binary packages are built for:
            - Linux x86_64
            - macOS ARM64

            Release artifacts are attached to this release, and crates are also published to crates.io from this tag.
          fail_on_unmatched_files: true

  publish:
    name: publish crates.io
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1)"
          version="$(echo "$metadata" | jq -r '.packages[] | select(.name == "r2smt-cli") | .version' | head -n 1)"

          edge_file="$(mktemp)"
          node_file="$(mktemp)"
          trap 'rm -f "$edge_file" "$node_file"' EXIT

          echo "$metadata" | jq -r '
            . as $m
            | ($m.packages | map({key: .id, value: .name}) | from_entries) as $ids
            | $m.resolve.nodes[]
            | .id as $from
            | .deps[]
            | select(.pkg | startswith("path+file://"))
            | ($ids[$from] + " " + $ids[.pkg])
          ' > "$edge_file"
          echo "$metadata" | jq -r '.packages[] | select(.source == null) | .name' | awk '{print $1 " " $1}' > "$node_file"

          for crate in $( (cat "$edge_file"; cat "$node_file") | tsort | tac ); do
            if curl -fsSL "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${crate} ${version} already exists on crates.io, skipping"
              continue
            fi

            for attempt in 1 2 3; do
              if output="$(cargo publish --locked -p "${crate}" 2>&1)"; then
                echo "Published ${crate} ${version}"
                break
              fi

              if echo "$output" | grep -q "Too Many Requests"; then
                if [ "$attempt" -ge 3 ]; then
                  echo "$output"
                  echo "Failed publishing ${crate} after 3 rate-limit retries"
                  exit 1
                fi

                wait=$((attempt * 75))
                echo "${crate} publish rate-limited (attempt ${attempt}/3); retrying after ${wait}s"
                sleep "$wait"
                continue
              fi

              echo "$output"
              echo "Failed publishing ${crate}; aborting"
              exit 1
            done
          done
