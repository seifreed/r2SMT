name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # r2smt-explore excluded from --all-features: its off-by-default
      # oracle-radius2 feature vendors boolector, which fails against cmake >= 4.
      - run: cargo check --workspace --exclude r2smt-explore --all-targets --all-features
      - run: cargo check -p r2smt-explore --all-targets

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude r2smt-explore --all-targets --all-features -- -D warnings
      - run: cargo clippy -p r2smt-explore --all-targets -- -D warnings

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo doc --workspace --exclude r2smt-explore --no-deps --all-features
      - run: cargo doc -p r2smt-explore --no-deps

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install worker sandbox
        run: bash scripts/install-worker-sandbox.sh
      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
      - run: cargo test --workspace --exclude r2smt-explore --all-features
      - run: cargo test -p r2smt-explore

  solver-contracts:
    name: solver-contracts gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verdict-ladder soundness invariants (fail-closed)
        run: ./scripts/quality-gates.sh solver-contracts

  determinism:
    name: determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Pinned-seed verdict stability (Z3 FFI, single-threaded)
        run: ./scripts/quality-gates.sh determinism

  supply-chain:
    name: supply-chain (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          tool: cargo-audit,cargo-deny
      - run: ./scripts/quality-gates.sh supply-chain

  r2-compatibility:
    name: radare2 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 6.1.8
            version: 6.1.8
            from_git: "false"
          - name: 6.2.0
            version: 6.2.0
            from_git: "false"
          - name: master
            version: ""
            from_git: "true"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install worker sandbox
        run: bash scripts/install-worker-sandbox.sh
      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: ${{ matrix.version }}
          from-git: ${{ matrix.from_git }}
      - run: cargo build --locked -p r2smt-cli
      - name: Real analysis and r2pipe contracts
        run: |
          target/debug/r2smt doctor
          target/debug/r2smt analyze /usr/bin/true
          target/debug/r2smt solve /usr/bin/true --include-real --include-suspicious --json "${RUNNER_TEMP}/r2smt-report.json"
          ./scripts/quality-gates.sh r2pipe-contracts

  r2pm-install:
    name: r2pm source install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install worker sandbox
        run: bash scripts/install-worker-sandbox.sh
      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: 6.2.0
      - name: Install current checkout through r2pm
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/r2pm
        run: |
          r2pm -U
          dbdir="$(r2pm -H R2PM_DBDIR)"
          gitdir="$(r2pm -H R2PM_GITDIR)"
          cp r2pm/r2smt "$dbdir/r2smt"
          git clone --local "$GITHUB_WORKSPACE" "$gitdir/r2smt"
          USE_PREBUILT=0 R2PM_GITSKIP=1 r2pm -i r2smt
          cli="$(r2pm -H R2PM_BINDIR)/r2smt"
          "$cli" version
          plugin="$(r2pm -H R2PM_PLUGDIR)/core_r2smt.$(r2 -H R2_LIBEXT)"
          test -f "$plugin"
          test -f "$(r2pm -H R2PM_PLUGDIR)/r2smt.r2"
          ./scripts/r2-plugin-smoke.sh "$plugin" /usr/bin/true
          corpus_root="$(./scripts/fetch-bench-corpus.sh "${RUNNER_TEMP}/r2smt-public-corpus")"
          corpus="$(./scripts/build-bench-corpus.sh "${RUNNER_TEMP}/r2smt-corpus" "$corpus_root")"
          ./scripts/r2pm-annotate-smoke.sh \
            "$cli" "$(dirname "$corpus")/patch-control-flow" \
            "${RUNNER_TEMP}/r2smt-annotate"

  real-binaries:
    name: zero false actionable findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install worker sandbox
        run: bash scripts/install-worker-sandbox.sh
      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: 6.2.0
      - run: ./scripts/quality-gates.sh real-binaries
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: r2smt-bench-metrics
          path: target/r2smt-bench-metrics.json
          if-no-files-found: error

  unicorn-differential:
    name: Unicorn external differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Install Python execution oracles
        run: python3 -m pip install --disable-pip-version-check --user unicorn==2.1.4 capstone==5.0.3 keystone-engine==0.9.2
      - name: Install radare2
        uses: radareorg/github-actions@4ae27a8b29a049ac0fd5119f6eda37ecfc64ead8 # main 2026-08-23
        with:
          version: 6.2.0
      - run: python3 scripts/unicorn-differential.py --iterations 8

  msvc-matrix:
    name: MSVC portable matrix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run Windows sandbox smoke test
        run: cargo run --locked -p r2smt-windows-sandbox --example sandbox-smoke
      - name: Build MSVC relocatable fixtures
        shell: pwsh
        run: ./scripts/build-msvc-matrix.ps1
      - name: Validate MSVC matrix
        shell: pwsh
        run: |
          $manifest = Get-Content target/r2smt-bench-corpus/portable-matrix-msvc/manifest.json | ConvertFrom-Json
          if ($manifest.schema_version -ne 1 -or $manifest.fixture -ne "portable-matrix") { throw "invalid matrix manifest" }
          if (@($manifest.variants).Count -lt 3) { throw "MSVC matrix is incomplete" }
          if (@($manifest.variants.architecture | Select-Object -Unique).Count -lt 2) { throw "MSVC architecture coverage is incomplete" }
          foreach ($variant in $manifest.variants) {
            if ($variant.compiler -ne "msvc" -or -not (Test-Path "target/r2smt-bench-corpus/portable-matrix-msvc/$($variant.artifact)")) {
              throw "missing MSVC artifact $($variant.artifact)"
            }
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-matrix-msvc
          path: target/r2smt-bench-corpus/portable-matrix-msvc
